<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>Hotel Cortez TV</title>
  <style>
    html,body{margin:0;padding:0;background:#050003;width:100%;height:100%;overflow:hidden;color:#ffd6ea;font-family:Arial,sans-serif}
    #player,#player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
    /* Invisible layer the game "clicks" so the browser allows sound (autoplay policy). */
    #unlock{position:absolute;inset:0;z-index:3;background:transparent}
    #status{position:absolute;z-index:4;left:0;right:0;bottom:0;padding:16px 20px;background:linear-gradient(transparent,rgba(0,0,0,.92));font-size:20px;text-align:center;pointer-events:none;text-shadow:0 0 8px #ff2a8a}
    #status:empty{display:none}
  </style>
</head>
<body>
  <div id="player"></div><div id="unlock"></div><div id="status">Loading...</div>
  <script src="player.js"></script>
</body>
</html>
